name: Svelte app checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hausstand-svelte/package-lock.json
      - name: Install
        working-directory: hausstand-svelte
        run: npm ci
      - name: JavaScript syntax and unit tests
        working-directory: hausstand-svelte
        run: |
          npm run check:js
          npm test
      - name: Build offline HTML
        working-directory: hausstand-svelte
        run: npm run build:single
      - name: Confirm standalone artifact
        working-directory: hausstand-svelte
        run: |
          test -s dist/hausstand-standalone.html
          if grep -Eq 'src="/assets/|href="/assets/' dist/hausstand-standalone.html; then
            echo "Uninlined assets remain" >&2
            exit 1
          fi
      - name: Publish downloadable offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: hausstand-standalone
          path: hausstand-svelte/dist/hausstand-standalone.html
          if-no-files-found: error
          retention-days: 14
