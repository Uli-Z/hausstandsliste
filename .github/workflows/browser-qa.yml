name: Browser acceptance QA
on:
  workflow_dispatch:
  push:
    branches: [qa/q32-purchase-entry-2026-11-26]
    paths: ['.github/workflows/browser-qa.yml']
permissions:
  contents: read
jobs:
  before-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct the pre-fix application with the new regression
        run: git checkout 220151f1be12030e88d45e5053f523d598860d12 -- hausstand-svelte/ui-v3 hausstand-svelte/src/stores/projectStore.js
      - name: Install Chromium and build
        working-directory: hausstand-svelte
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
          npm run build:single
      - name: Require pre-fix failure at the actual form assertions
        working-directory: hausstand-svelte
        env:
          Q32_BASELINE: '1'
        run: |
          set +e
          npm run test:browser > q32-before.log 2>&1
          status=$?
          set -e
          cat q32-before.log
          test "$status" -ne 0
          grep -E 'name survives (click/blur|unrelated store notification)|minimum must not be hidden' q32-before.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q32-before-log
          path: hausstand-svelte/q32-before.log
  after-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install all three browser engines and build
        working-directory: hausstand-svelte
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium firefox webkit
          npm run build:single
      - name: Q32 sequential form regression
        working-directory: hausstand-svelte
        env:
          Q32_SCREENSHOT_DIR: q32-screenshots
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q32-after-screenshots
          path: hausstand-svelte/q32-screenshots
