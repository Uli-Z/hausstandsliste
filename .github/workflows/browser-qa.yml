name: Browser acceptance QA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hausstand-svelte/package-lock.json
      - name: Install application and test-only browser tooling
        working-directory: hausstand-svelte
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Build offline HTML and encrypted PHP release
        working-directory: hausstand-svelte
        run: |
          npm run build:single
          npm run build:php
      - name: Exercise two browsers, file history and session Undo/Redo
        working-directory: hausstand-svelte
        run: npm run test:browser
