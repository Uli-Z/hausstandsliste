name: Browser acceptance QA

# Browser engines and Playwright dependencies are costly to run.
# Trigger this suite explicitly under Actions > Browser acceptance QA > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [qa/q34-purchase-breakdown-2026-11-26]
    paths: [.github/workflows/browser-qa.yml]

permissions:
  contents: read

jobs:
  chromium:
    # Pin the LTS runner: ubuntu-latest moved to 26.04, where browser
    # dependency downloads exhausted the previous job timeout.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hausstand-svelte/package-lock.json
      - name: Install application and test-only browser tooling
        working-directory: hausstand-svelte
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Build offline HTML and encrypted PHP release
        working-directory: hausstand-svelte
        run: |
          npm run build:single
          npm run build:php
      - name: Exercise Chromium, Firefox, WebKit, portable history and responsive UI
        working-directory: hausstand-svelte
        run: npm run test:browser
