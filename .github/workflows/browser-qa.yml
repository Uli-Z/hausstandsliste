name: Browser acceptance QA (Q33)
on:
  workflow_dispatch:
  push:
    branches: [qa/q33-form-state-2026-11-26]
    paths: ['.github/workflows/browser-qa.yml']
permissions:
  contents: read
jobs:
  q33:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build all variants
        working-directory: hausstand-svelte
        run: |
          npm ci
          npm run check:js
          npm test
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium firefox webkit
          npm run build:single
          npm run build:php
      - name: Run real browser regressions across form families
        working-directory: hausstand-svelte
        env:
          Q32_SCREENSHOT_DIR: q33-screenshots
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q33-screenshots
          path: hausstand-svelte/q33-screenshots
