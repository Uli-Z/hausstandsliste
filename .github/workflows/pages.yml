name: Deploy Hausstand to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hausstand-svelte/package-lock.json
      - name: Configure Pages (first-time activation may require owner action)
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Build standalone website
        working-directory: hausstand-svelte
        run: |
          npm ci
          npm test
          npm run build:single
          mkdir -p dist/pages
          cp dist/hausstand-standalone.html dist/pages/index.html
          touch dist/pages/.nojekyll
      - name: Downloadable Pages preview (also if Pages not yet enabled)
        uses: actions/upload-artifact@v4
        with:
          name: hausstand-pages-preview
          path: hausstand-svelte/dist/pages/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages deployment artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: hausstand-svelte/dist/pages
  deploy:
    if: needs.build.outputs.pages_enabled == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
