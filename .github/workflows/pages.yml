name: Deploy Hausstand to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hausstand-svelte/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build standalone website
        working-directory: hausstand-svelte
        run: |
          npm ci
          npm test
          npm run build:single
          mkdir -p dist/pages
          cp dist/hausstand-standalone.html dist/pages/index.html
          touch dist/pages/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: hausstand-svelte/dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
