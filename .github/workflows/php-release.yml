name: Build PHP single-file release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  build-php-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hausstand-svelte/package-lock.json
      - name: Install dependencies
        working-directory: hausstand-svelte
        run: npm ci
      - name: Domain and crypto tests
        working-directory: hausstand-svelte
        run: npm test
      - name: Build PHP app with integrated server UI V3
        working-directory: hausstand-svelte
        env:
          HAUSSTAND_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('php-{0}', github.run_number) }}
        run: npm run build:php
      - name: Validate PHP syntax and exercise API
        working-directory: hausstand-svelte
        run: |
          php -l dist/hausstand.php
          php -l server-php/backend.php
          php server-php/update-test.php
          node server-php/smoke.mjs
      - name: Upload PHP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hausstand-php-manual
          path: hausstand-svelte/dist/hausstand.php
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest PHP release
        if: github.event_name == 'schedule' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('php-{0}', github.run_number) }}
          name: Hausstandsliste PHP ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          files: hausstand-svelte/dist/hausstand.php
          make_latest: true
          generate_release_notes: true
